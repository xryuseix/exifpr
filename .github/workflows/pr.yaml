name: ExifPR

on:
  pull_request:
    types: [opened]
  issue_comment:
    types:
      - created

jobs:
  exifpr:
    if: (github.event.issue.pull_request != null) && github.event.comment.body == '!github exifpr'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/github-script@v2
      id: set-target-branch
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        result-encoding: string
        script: |
          const pull_request = await github.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          })
          return pull_request.data.head.ref

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.set-target-branch.outputs.result }}

    - name: ExifPR
      uses: xryuseix/exifpr@v1.0
      with:
        target_ext: .png .jpeg .jpg .gif .bmp .pdf .mp4 .mp3 .wav
        repository: ${{ github.repository }}
        pr_number: ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
